name: Daily DPDP regulatory change check

on:
  schedule:
    # 06:00 IST == 00:30 UTC. GitHub Actions cron is always UTC.
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python src/run_pipeline.py

      - name: Commit and push updated db/docs/data
        run: |
          git config user.name "dpdp-change-monitor[bot]"
          git config user.email "actions@github.com"
          git add db/dpdpa.db docs/*.docx data/*.xlsx
          if git diff --cached --quiet; then
            echo "No tracked changes to commit."
          else
            git commit -m "Automated DPDP regulatory change check — $(date -u +%Y-%m-%d)"
            git push
          fi
