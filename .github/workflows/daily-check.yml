name: Daily DPDP regulatory change check

on:
  schedule:
    # 06:17 IST == 00:47 UTC. GitHub Actions cron is always UTC. Moved off
    # the busy top-of-hour mark (00:30) per the 23 Sep 2026 audit — GitHub's
    # scheduler queues jobs started exactly on :00/:30, sometimes by several
    # hours; a few minutes off that mark tends to start sooner, though
    # GitHub makes no timing guarantee either way.
    - cron: "47 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-4-5' }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python src/run_pipeline.py

      - name: Commit and push updated db/docs/data
        if: always()
        run: |
          git config user.name "dpdp-change-monitor[bot]"
          git config user.email "actions@github.com"
          git add db/dpdpa.db docs/*.docx data/*.xlsx
          if git diff --cached --quiet; then
            echo "No tracked changes to commit."
          else
            git commit -m "Automated DPDP regulatory change check — $(date -u +%Y-%m-%d)"
            git push
          fi
